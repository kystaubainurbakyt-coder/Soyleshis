<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOYLE · Admin</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#172b45;background:#f3f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#dfeaff 0,transparent 32rem),#f3f6fb}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:700;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait;transform:none}.primary{background:#183e70;color:#fff}.secondary{background:#eaf0f8;color:#29445f}.danger{background:#fff0ed;color:#a93632}.topbar{display:flex;align-items:center;gap:18px;padding:15px clamp(16px,4vw,54px);background:#102b4c;color:white;box-shadow:0 8px 28px #122b4920}.brand{font-weight:900;letter-spacing:.18em;font-size:19px}.topbar .sub{color:#d4dfeb;flex:1}.topbar select{border:1px solid #ffffff35;background:#19385d;color:white;border-radius:10px;padding:9px}.wrap{max-width:1500px;margin:auto;padding:24px clamp(14px,3vw,38px) 48px}.announce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;padding:18px 20px;background:#fff;border:1px solid #dbe5f1;border-radius:18px;box-shadow:0 10px 32px #213b5c0b;margin-bottom:20px}.announce h2{margin:0 0 5px;font-size:18px}.announce p{margin:0;color:#667a92;font-size:13px}.announce-controls{display:flex;gap:10px;align-items:end;min-width:min(520px,48vw)}.announce textarea{flex:1;min-height:46px;max-height:120px;resize:vertical;border:1px solid #d7e1ee;border-radius:11px;padding:11px 12px;outline:none}.announce textarea:focus,input:focus,select:focus{border-color:#5d8fc8;box-shadow:0 0 0 3px #5d8fc820}.send{background:#14765d;color:white;white-space:nowrap;min-height:46px}.counter{color:#7a8ba0;font-size:11px;text-align:right;margin-top:4px}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px}.card{background:white;border:1px solid #e2e9f1;border-radius:20px;box-shadow:0 12px 36px #213b5c0a}.side{padding:18px;height:max-content;position:sticky;top:18px}.sidehead,.editor-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.sidehead h2,.editor h2{margin:0;font-size:19px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.stat{padding:12px;border-radius:13px;background:#f3f6fa}.stat b{font-size:20px;display:block}.stat small{color:#718198}.field{display:block;margin:12px 0}.field span{display:block;color:#52657b;font-size:12px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4ee;border-radius:11px;padding:11px 12px;background:#fff;color:#182a42;outline:none}.list-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#75849a;margin:18px 4px 8px}.list{max-height:48vh;overflow:auto}.lesson{width:100%;display:flex;align-items:center;gap:10px;text-align:left;margin:5px 0;background:#f6f8fb;color:#263a53}.lesson.active{background:#eaf2ff;outline:1px solid #b8d0ed}.level{flex:none;min-width:38px;text-align:center;padding:5px 6px;border-radius:8px;background:#dce8f7;color:#20446e;font-size:10px}.lesson-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.editor{padding:clamp(18px,3vw,30px)}.hint{color:#6e8095;margin:7px 0 18px;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field textarea{min-height:100px;resize:vertical;line-height:1.5}.section{margin-top:20px;padding-top:18px;border-top:1px solid #e8edf3}.section h3{margin:0 0 5px;font-size:15px}.section p{font-size:12px;color:#718197;margin:0 0 10px}.phrase{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));align-items:start;gap:9px;padding:10px 0;border-top:1px solid #edf1f5}.phrase-index{font-size:11px;color:#8190a2;padding-top:12px}.phrase textarea{min-height:65px!important}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.status{min-height:24px;font-size:13px;color:#177353;margin-top:12px}.status.error{color:#b33d39}.footer{font-size:11px;color:#7b8a9d;margin:14px 3px 0;line-height:1.5}.hide{display:none!important}@media(max-width:960px){.layout{grid-template-columns:1fr}.side{position:static}.list{max-height:220px}.announce{grid-template-columns:1fr}.announce-controls{min-width:0}}@media(max-width:650px){.topbar{gap:10px;padding:12px 14px}.topbar .sub{font-size:12px}.announce-controls{flex-direction:column;align-items:stretch}.announce textarea{width:100%}.grid,.grid.three{grid-template-columns:1fr}.phrase{grid-template-columns:24px 1fr}.phrase .phrase-cell{grid-column:2}.actions{flex-direction:column-reverse}.actions button{width:100%}}
</style>
<header class="topbar"><div class="brand">SOYLE</div><div class="sub" id="subtitle"></div><select id="language" aria-label="Language"><option value="ru">RU</option><option value="en">EN</option></select></header>
<main class="wrap">
  <section class="announce" aria-labelledby="announceTitle">
    <div><h2 id="announceTitle"></h2><p id="announceHint"></p><div class="counter" id="announceStatus" role="status" aria-live="polite"></div></div>
    <div class="announce-controls"><textarea id="announcement" maxlength="500" aria-label="Announcement"></textarea><button class="send" id="sendAnnouncement" type="button"></button></div>
  </section>
  <div class="layout">
    <aside class="card side">
      <div class="sidehead"><h2 id="panelTitle"></h2><button class="primary" id="new" type="button"></button></div>
      <div class="stats"><div class="stat"><b id="lessonCount">—</b><small id="lessonsLabel"></small></div><div class="stat"><b>5</b><small id="levelsLabel"></small></div></div>
      <label class="field"><span id="searchLabel"></span><input id="search" type="search"></label>
      <label class="field"><span id="filterLabel"></span><select id="filter"><option value="">—</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select></label>
      <div class="list-title" id="listTitle"></div><div class="list" id="list"></div>
      <div class="footer" id="securityNote"></div>
    </aside>
    <section class="card editor">
      <div class="editor-top"><h2 id="editorTitle"></h2><span class="level" id="selectedLevel">—</span></div>
      <p class="hint" id="editorHint"></p>
      <form id="form">
        <div class="grid three">
          <label class="field"><span>ID</span><input id="identity" type="number" readonly></label>
          <label class="field"><span id="levelLabel"></span><select id="level"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select></label>
          <label class="field"><span id="durationLabel"></span><input id="minutes" type="number" min="5" max="120" required></label>
        </div>
        <div class="grid three">
          <label class="field"><span id="titleKkLabel"></span><input id="titleKk" required minlength="3"></label>
          <label class="field"><span id="titleRuLabel"></span><input id="titleRu" required minlength="3"></label>
          <label class="field"><span id="titleEnLabel"></span><input id="titleEn" required minlength="3"></label>
        </div>
        <div class="grid">
          <label class="field"><span id="ruleRuLabel"></span><textarea id="ruleRu" required minlength="30"></textarea></label>
          <label class="field"><span id="ruleEnLabel"></span><textarea id="ruleEn" required minlength="30"></textarea></label>
        </div>
        <div class="section"><h3 id="phrasesTitle"></h3><p id="phrasesHint"></p><div id="phrases"></div></div>
        <div class="actions"><button class="danger hide" id="delete" type="button"></button><button class="primary" id="save" type="submit"></button></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let catalog=[],current=null,activeId=null,lang=localStorage.getItem('soyle-admin-lang')==='en'?'en':'ru';
$('language').value=lang;
const copy={
ru:{subtitle:'Управление курсами SOYLE',panel:'Панель администратора',new:'+ Новый урок',lessons:'уроков',levels:'уровней',announcement:'Объявление для учеников',announcementHint:'Сообщение сразу появится у всех, кто открыл учебную комнату.',send:'Отправить объявление',sent:'Объявление отправлено.',emptyAnnouncement:'Введите текст объявления.',search:'Поиск уроков',filter:'Уровень',all:'Все уровни',list:'Список уроков',rights:'Можно добавлять, редактировать и удалять уроки, а также отправлять объявления.',editor:'Содержание урока',editorHint:'Заполните заголовок на казахском, переводы, объяснения и примеры.',level:'Уровень',duration:'Длительность · минут',titleKk:'Название по-казахски',titleRu:'Название по-русски',titleEn:'Название по-английски',ruleRu:'Объяснение · RU',ruleEn:'Объяснение · EN',phrases:'Фразы и диалоги',phrasesHint:'Заполните все примеры на казахском, русском и английском.',delete:'Удалить урок',save:'Сохранить изменения',choose:'Выберите урок или создайте новый',saved:'Изменения сохранены. Перезапустите приложение, чтобы обновить каталог.',deleted:'Урок удалён.',error:'Ошибка: ',confirmDelete:'Удалить этот урок из каталога?',empty:'Уроки не найдены.',langKk:'Казахский',langRu:'Русский',langEn:'Английский'},
en:{subtitle:'Manage SOYLE courses',panel:'Administrator panel',new:'+ New lesson',lessons:'lessons',levels:'levels',announcement:'Announcement for learners',announcementHint:'The message appears immediately for everyone in the study room.',send:'Send announcement',sent:'Announcement sent.',emptyAnnouncement:'Enter an announcement first.',search:'Search lessons',filter:'Level',all:'All levels',list:'Lessons',rights:'Add, edit and delete lessons, and send announcements to learners.',editor:'Lesson content',editorHint:'Fill in the Kazakh title, translations, explanations, and examples.',level:'Level',duration:'Duration · minutes',titleKk:'Kazakh title',titleRu:'Russian title',titleEn:'English title',ruleRu:'Explanation · RU',ruleEn:'Explanation · EN',phrases:'Phrases and dialogues',phrasesHint:'Fill in every example in Kazakh, Russian, and English.',delete:'Delete lesson',save:'Save changes',choose:'Choose a lesson or create a new one',saved:'Changes saved. Restart the app to refresh the catalog.',deleted:'Lesson deleted.',error:'Error: ',confirmDelete:'Delete this lesson from the catalog?',empty:'No lessons found.',langKk:'Kazakh',langRu:'Russian',langEn:'English'}
};
const tr=key=>copy[lang][key]||key;
function setStatus(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function setAnnouncementStatus(message,error=false){$('announceStatus').textContent=message;$('announceStatus').style.color=error?'#b33d39':'#177353'}
async function api(path,options={}){const headers={...options.headers};if(options.body)headers['Content-Type']='application/json';const response=await fetch(path,{credentials:'same-origin',...options,headers});let data={};try{data=await response.json()}catch{}if(!response.ok)throw Error(data.error||String(response.status));return data}
function translate(){document.documentElement.lang=lang;const ids={subtitle:'subtitle',panelTitle:'panel',new:'new',lessonsLabel:'lessons',levelsLabel:'levels',announceTitle:'announcement',announceHint:'announcementHint',sendAnnouncement:'send',searchLabel:'search',filterLabel:'filter',all:'all',listTitle:'list',securityNote:'rights',editorHint:'editorHint',levelLabel:'level',durationLabel:'duration',titleKkLabel:'titleKk',titleRuLabel:'titleRu',titleEnLabel:'titleEn',ruleRuLabel:'ruleRu',ruleEnLabel:'ruleEn',phrasesTitle:'phrases',phrasesHint:'phrasesHint',delete:'delete',save:'save'};for(const[id,key]of Object.entries(ids))$(id).textContent=tr(key);$('filter').options[0].textContent=tr('all');$('announcement').placeholder=lang==='ru'?'Напишите короткое объявление для учеников…':'Write a short announcement for learners…';$('announcement').setAttribute('aria-label',tr('announcement'));renderList();if(current)renderPhrases()}
function renderList(){const q=$('search').value.trim().toLocaleLowerCase();const filter=$('filter').value;const rows=catalog.filter(item=>(!filter||item.level===filter)&&(`${item.title.kk} ${item.title.ru} ${item.title.en}`.toLocaleLowerCase().includes(q)));$('list').replaceChildren();$('lessonCount').textContent=catalog.length;$('lessonsLabel').textContent=tr('lessons');for(const lesson of rows){const button=document.createElement('button');button.type='button';button.className='lesson'+(lesson.id===activeId?' active':'');const level=document.createElement('span');level.className='level';level.textContent=lesson.level;const title=document.createElement('span');title.className='lesson-name';title.textContent=lesson.title[lang];button.append(level,title);button.onclick=()=>edit(lesson);$('list').append(button)}if(!rows.length){const empty=document.createElement('p');empty.className='hint';empty.textContent=tr('empty');$('list').append(empty)}}
function renderPhrases(){if(!current)return;$('phrases').replaceChildren();current.phrases.forEach((phrase,index)=>{const row=document.createElement('div');row.className='phrase';const number=document.createElement('span');number.className='phrase-index';number.textContent=String(index+1).padStart(2,'0');row.append(number);for(const code of ['kk','ru','en']){const label=document.createElement('label');label.className='field phrase-cell';const caption=document.createElement('span');caption.textContent=tr(code==='kk'?'langKk':code==='ru'?'langRu':'langEn');const textarea=document.createElement('textarea');textarea.required=true;textarea.value=phrase[code]||'';textarea.oninput=()=>current.phrases[index][code]=textarea.value;label.append(caption,textarea);row.append(label)}$('phrases').append(row)})}
function edit(lesson){current=structuredClone(lesson);activeId=lesson.id;$('delete').classList.toggle('hide',!catalog.some(item=>item.id===lesson.id));$('identity').value=current.id;$('level').value=current.level;$('selectedLevel').textContent=current.level;$('minutes').value=current.minutes;for(const code of ['Kk','Ru','En'])$('title'+code).value=current.title[code.toLowerCase()]||'';$('ruleRu').value=current.rule.ru||'';$('ruleEn').value=current.rule.en||'';$('editorTitle').textContent=`${tr('editor')} · ${lesson.id}`;setStatus('');renderPhrases();renderList()}
function newLesson(){const id=Math.max(0,...catalog.map(item=>item.id))+1;const lesson={id,level:'A1',minutes:15,title:{kk:'',ru:'',en:''},rule:{ru:'',en:''},phrases:Array.from({length:6},()=>({kk:'',ru:'',en:''}))};edit(lesson);$('delete').classList.add('hide')}
$('language').onchange=()=>{lang=$('language').value;localStorage.setItem('soyle-admin-lang',lang);translate();if(current){const found=catalog.find(item=>item.id===current.id);if(found)edit(found)}};
$('new').onclick=newLesson;$('filter').onchange=renderList;$('search').oninput=renderList;
$('announcement').oninput=()=>setAnnouncementStatus(`${$('announcement').value.length} / 500`);
$('sendAnnouncement').onclick=async()=>{const message=$('announcement').value.trim();if(!message){setAnnouncementStatus(tr('emptyAnnouncement'),true);$('announcement').focus();return}const button=$('sendAnnouncement');button.disabled=true;setAnnouncementStatus('…');try{await api('/api/announcement',{method:'POST',body:JSON.stringify({text:message})});$('announcement').value='';setAnnouncementStatus(tr('sent'))}catch(error){setAnnouncementStatus(tr('error')+error.message,true)}finally{button.disabled=false}};
$('form').onsubmit=async event=>{event.preventDefault();if(!current)return;current.level=$('level').value;current.minutes=Number($('minutes').value);for(const code of ['Kk','Ru','En'])current.title[code.toLowerCase()]=$('title'+code).value.trim();current.rule={ru:$('ruleRu').value.trim(),en:$('ruleEn').value.trim()};const button=$('save');button.disabled=true;try{const result=await api('/api/lesson',{method:'POST',body:JSON.stringify(current)});catalog=await api('/api/catalog');activeId=current.id;renderList();setStatus(tr('saved'));if(result.action==='created')edit(current)}catch(error){setStatus(tr('error')+error.message,true)}finally{button.disabled=false}};
$('delete').onclick=async()=>{if(!current||!confirm(tr('confirmDelete')))return;const button=$('delete');button.disabled=true;try{await api('/api/lesson/'+current.id,{method:'DELETE'});catalog=await api('/api/catalog');current=null;activeId=null;$('form').reset();$('phrases').replaceChildren();$('editorTitle').textContent=tr('choose');$('selectedLevel').textContent='—';renderList();setStatus(tr('deleted'))}catch(error){setStatus(tr('error')+error.message,true)}finally{button.disabled=false}};
$('announcement').oninput();translate();api('/api/catalog').then(data=>{catalog=data;renderList();if(catalog.length)edit(catalog[0]);else newLesson()}).catch(error=>{setStatus(tr('error')+error.message,true)});
</script>
</html>
