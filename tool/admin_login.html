<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOYLE · Вход администратора</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#dbeaff,transparent 32rem),linear-gradient(140deg,#eef3fa,#f8f8f5);font:15px "Segoe UI",Arial,sans-serif;color:#172a42}.card{width:min(430px,100%);background:#fff;border:1px solid #e2e9f2;border-radius:24px;padding:32px;box-shadow:0 24px 70px #18375b1c}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900;letter-spacing:.2em;color:#143b6d}select,input,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #d8e1ec}select{padding:8px;background:#f5f8fc;color:#243b55}h1{font-size:25px;margin:30px 0 7px}p{line-height:1.6;color:#6a7c91;margin:0 0 22px}.field{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;outline:none}input:focus{border-color:#5788c2;box-shadow:0 0 0 3px #5788c21f}button{width:100%;margin-top:14px;background:#153e75;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:23px;color:#ad3836;font-size:13px;margin:11px 0 0}.secure{padding:12px;background:#f4f7fb;border-radius:12px;font-size:12px;color:#74849a;margin-top:20px}.mark{display:flex;align-items:center;gap:12px}.mark-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#e7effa;color:#173f73;font-size:20px}
</style>
<main class="card"><div class="top"><div class="brand">SOYLE</div><select id="lang" aria-label="Language"><option value="ru">RU</option><option value="en">EN</option></select></div><div class="mark" style="margin-top:30px"><div class="mark-icon">⌘</div><div><h1 id="title" style="margin:0"></h1><p id="subtitle" style="margin:4px 0 0"></p></div></div><form id="form"><label class="field" id="label" for="password"></label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><div class="error" id="error" role="alert" aria-live="polite"></div><button id="submit" type="submit"></button></form><div class="secure" id="secure"></div></main>
<script>
const $=id=>document.getElementById(id),language={ru:{title:'Вход администратора',subtitle:'Управление учебными материалами SOYLE',label:'Пароль',submit:'Войти',secure:'Панель управления доступна на этом компьютере.',incorrect:'Неверный пароль. Проверьте ввод.',limited:'Слишком много попыток. Повторите через 60 секунд.',failed:'Не удалось войти. Проверьте, запущен ли локальный сервер.'},en:{title:'Administrator sign in',subtitle:'Manage SOYLE learning content',label:'Password',submit:'Sign in',secure:'The admin panel is available on this computer.',incorrect:'Incorrect password. Please check it and try again.',limited:'Too many attempts. Try again in 60 seconds.',failed:'Sign in failed. Check that the local server is running.'}};
function translate(){const lang=$('lang').value,copy=language[lang];document.documentElement.lang=lang;for(const key of ['title','subtitle','label','submit','secure'])$(key).textContent=copy[key]}
$('lang').onchange=translate;translate();$('form').onsubmit=async event=>{event.preventDefault();const button=$('submit');button.disabled=true;$('error').textContent='';try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});if(!response.ok){const detail=await response.json();const copy=language[$('lang').value];throw Error(detail.error==='Incorrect password'?copy.incorrect:detail.error?.includes('60')?copy.limited:copy.failed)}location.replace('/')}catch(error){$('error').textContent=error.message}finally{button.disabled=false}};
</script>
</html>
